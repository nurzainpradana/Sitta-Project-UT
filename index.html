
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="SITTA - Sistem Informasi Tiras dan Transaksi Bahan Ajar Universitas Terbuka">

    <title>Login | SITTA Universitas Terbuka</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/data.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="login-page">
        <section class="login-container">

            <header class="login-header">
                <h1>SITTA</h1>
                <p>Sistem Informasi Tiras dan Transaksi Bahan Ajar</p>
                <p>Universitas Terbuka</p>
            </header>

            <section class="login-card">
                <h2>Login</h2>
                <p>Silakan masuk menggunakan akun Anda.</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="nama@ut.ac.id"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Login
                    </button>
                </form>

                <nav class="login-links" aria-label="Bantuan akun">
                    <button type="button" id="forgotPasswordBtn">
                        Lupa Password?
                    </button>

                    <button type="button" id="registerBtn">
                        Daftar
                    </button>
                </nav>
            </section>

            <footer class="login-footer">
                <p>&copy; 2026 Universitas Terbuka</p>
            </footer>
        </section>
    </main>


    <!-- MODAL LUPA PASSWORD -->
    <div
        class="modal"
        id="forgotPasswordModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="forgotPasswordTitle"
        hidden
    >
        <section class="modal-content">
            <button
                type="button"
                class="modal-close"
                data-close-modal
                aria-label="Tutup modal"
            >&times;</button>

            <h2 id="forgotPasswordTitle">Lupa Password</h2>
            <p>
                Masukkan email akun Anda untuk memeriksa data pengguna.
            </p>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="forgotEmail">Email</label>
                    <input
                        type="email"
                        id="forgotEmail"
                        name="forgotEmail"
                        placeholder="nama@ut.ac.id"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Periksa Email
                </button>
            </form>

            <div id="forgotPasswordMessage"
                 class="mt-2"
                 aria-live="polite"></div>
        </section>
    </div>


    <!-- MODAL DAFTAR -->
    <div
        class="modal"
        id="registerModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="registerTitle"
        hidden
    >
        <section class="modal-content">
            <button
                type="button"
                class="modal-close"
                data-close-modal
                aria-label="Tutup modal"
            >&times;</button>

            <h2 id="registerTitle">Daftar Akun</h2>
            <p>
                Form simulasi pendaftaran pengguna SITTA.
            </p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="registerName">Nama Lengkap</label>
                    <input
                        type="text"
                        id="registerName"
                        name="registerName"
                        placeholder="Masukkan nama lengkap"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        name="registerEmail"
                        placeholder="nama@ut.ac.id"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        name="registerPassword"
                        placeholder="Minimal 6 karakter"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="modal-actions">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-close-modal
                    >
                        Batal
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Daftar
                    </button>
                </div>
            </form>

            <div id="registerMessage"
                 class="mt-2"
                 aria-live="polite"></div>
        </section>
    </div>

</body>
</html>
